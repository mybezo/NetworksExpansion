name: Auto Build

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    if: github.event_name != 'push' || startsWith(github.event.head_commit.message, '[ci skip]') == false
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # build.gradle.kts uses a Java 25 toolchain
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/reports/tests/test/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetworksExpansion-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
