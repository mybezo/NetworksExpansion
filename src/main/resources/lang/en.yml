      help:
        - "&6/networks help - Show this help message."
        - "&6ex: /networks help"
      celltoquantum:
        - "&6/networks celltoquantum - Converts the contents of the Storage Cell in your hand into a Quantum Storage of the matching tier."
        - "&6ex: /networks celltoquantum"
      fillquantum:
        - "&6/networks fillQuantum <amount> - Set the amount for the held Quantum Storage."
        - "&6ex: /networks fillQuantum 1000"
      fixblueprint:
        - "&6/networks fixBlueprint <keyInMeta> - Fix held Crafting Blueprint."
        - "&6ex: /networks fixBlueprint networks-changed"
      addstorageitem:
        - "&6/networks addStorageItem <amount> - Add specific amount of held item to the pointed Cargo Storage."
        - "&6ex: /networks addstorageItem 1000"
      reducestorageitem:
        - "&6/networks reduceStorageItem <amount> - Remove specific amount of held item from the pointed Cargo Storage."
        - "&6ex: /networks reduceStorageItem 1000"
      setquantum:
        - "&6/networks setQuantum <amount> - Set the pointed Quantum Storage to the held item and quantity."
        - "&6ex: /networks setQuantum 1000"
      setcontainerid:
        - "&6/networks setContainerId <containerId> - Set the Container ID for the pointed Cargo Storage."
        - "&6ex: /networks setContainerId 6"
      getstorageitem:
        - "&6/networks getStorageItem <slot> - Get item from specific slot of the pointed Cargo Storage."
        - "&6ex: /networks getStorageItem 0"
      updateitem:
        - "&6/networks updateItem - Update the held item."
        - "&6ex: /networks updateItem"
