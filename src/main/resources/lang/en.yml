  NTW_EXPANSION_ANNOUNCE_9:
    name: "<color_random_string>Networks Expansion Version Info"
    lore:
      - "<warning> Before reading this declaration, please read the Networks Expansion Supplementary Explanation first."
      - "<passive> Developer(s): ytdd9527, balugaq"
      - "<passive> Developer GitHub Page: <click_info>https://github.com/ytdd9527"
      - "<passive> Developer GitHub Page: <click_info>https://github.com/balugaq"
      - "<passive> Networks Expansion Stable Download: https://builds.guizhanss.com/ytdd9527/NetworksExpansion/master/builds"
      - "<passive> Networks Expansion Dev Download: https://github.com/balugaq/NetworksExpansion"
      - "<passive> Thanks to everyone who contributed Issues, PRs, commits to Networks Expansion development!"
      - "<passive> Thanks to everyone who provided suggestions for Networks Expansion development!"
      - "<passive> Thanks to players like Utoboy, TouRuya, haiman233, yitoudaidai, tinalness, matl114 who provided suggestions for Networks Expansion development!"
  NTW_EXPANSION_ANNOUNCE_10:
    name: "<color_random_string>Networks Expansion Gameplay Experience Declaration"
    lore:
      - "<warning> Before reading this declaration, please read the Networks Expansion Version Info first."
      - "<passive> Regarding the loss of blueprints in the Network Crafter, according to the announcement by Slimefun developers:"
      - "<passive> ——When item PDC data is too large, the item cannot be saved to the Slimefun database. Server owners need to adjust the database table data type themselves"
      - "<passive> ——And enable the `bypass-item-length-check` option in the settings to skip item size checks."
      - "<passive> The PDC of Network Crafter blueprints is usually huge to be compatible with blueprints from years ago and ensure player experience."
      - "<passive> In addition, according to matl114's test, upgrading machines in place may also cause item loss:"
      - "<passive> Here is an example that <warning>may<passive> be reproduced: Place machine A, place C amount of item D in slot B, break and replace with machine E, place C amount of item D in slot B,"
      - "<passive> After server restart, item D in machine E disappears."
      - "<passive> The above reasons have little to do with Networks Expansion. It is recommended to remain rational when playing and not blindly verbally attack Networks Expansion."
      - "<passive> Declaration ends here."

