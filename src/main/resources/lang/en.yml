      - "&6/networks help - Show this help message."
      - "&6/networks fillquantum <amount> - Fill the held Quantum Storage with amount."
      - "&6/networks fixblueprint <keyInMeta> - Fix the held Crafting Blueprint."
      - "&6/networks addstorageitem <amount> - Add items to the looked-at Network Drawer."
